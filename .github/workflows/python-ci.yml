name: Python ML Recommender CI

on:
  push:
    paths:
      - 'smartcart_python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'smartcart_python/**'

jobs:
  test-ml:
    name: Run Python ML Training & Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'smartcart_python/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r smartcart_python/requirements.txt

      - name: Train and Evaluate Recommender Model
        run: |
          cd smartcart_python
          python train_and_evaluate.py
